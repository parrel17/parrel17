<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="160">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-weight: 700; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-weight: 600; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Container -->
  <rect x="0" y="0" width="1200" height="160" rx="14" fill="url(#techBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Section 1: Languages & Runtime -->
  <g transform="translate(36, 32)">
    <circle cx="6" cy="6" r="4" fill="#38BDF8" />
    <text x="18" y="11" fill="#FFFFFF" class="font-sub" font-size="14">LANGUAGES &amp; RUNTIMES</text>
    <text x="0" y="42" fill="#38BDF8" class="font-mono" font-size="13" font-weight="700">Python 3.12</text>
    <text x="0" y="66" fill="#94A3B8" class="font-mono" font-size="12">Node.js 22 • TypeScript • Go</text>
    <text x="0" y="90" fill="#64748B" class="font-mono" font-size="11">FastAPI • Next.js • AsyncIO</text>
  </g>

  <!-- Divider 1 -->
  <line x1="320" y1="28" x2="320" y2="132" stroke="#1E293B" stroke-width="1" />

  <!-- Section 2: Systems & Networking -->
  <g transform="translate(356, 32)">
    <circle cx="6" cy="6" r="4" fill="#818CF8" />
    <text x="18" y="11" fill="#FFFFFF" class="font-sub" font-size="14">SYSTEMS &amp; INFRASTRUCTURE</text>
    <text x="0" y="42" fill="#818CF8" class="font-mono" font-size="13" font-weight="700">Linux Kernel (x86_64)</text>
    <text x="0" y="66" fill="#94A3B8" class="font-mono" font-size="12">Cloudflare WARP Anycast • Nginx</text>
    <text x="0" y="90" fill="#64748B" class="font-mono" font-size="11">Systemd • PM2 • UFW • Docker</text>
  </g>

  <!-- Divider 2 -->
  <line x1="680" y1="28" x2="680" y2="132" stroke="#1E293B" stroke-width="1" />

  <!-- Section 3: Data & Storage -->
  <g transform="translate(716, 32)">
    <circle cx="6" cy="6" r="4" fill="#34D399" />
    <text x="18" y="11" fill="#FFFFFF" class="font-sub" font-size="14">DATA &amp; STORAGE</text>
    <text x="0" y="42" fill="#34D399" class="font-mono" font-size="13" font-weight="700">SQLite 3 (WAL Mode)</text>
    <text x="0" y="66" fill="#94A3B8" class="font-mono" font-size="12">Google Drive VFS (5 TiB Mount)</text>
    <text x="0" y="90" fill="#64748B" class="font-mono" font-size="11">64M Cache • 256M mmap Tuning</text>
  </g>

  <!-- Divider 3 -->
  <line x1="970" y1="28" x2="970" y2="132" stroke="#1E293B" stroke-width="1" />

  <!-- Section 4: Engineering Directive -->
  <g transform="translate(1006, 32)">
    <circle cx="6" cy="6" r="4" fill="#F59E0B" />
    <text x="18" y="11" fill="#FFFFFF" class="font-sub" font-size="14">CORE DIRECTIVE</text>
    <text x="0" y="42" fill="#F59E0B" class="font-mono" font-size="13" font-weight="700">Zero Slop Code</text>
    <text x="0" y="66" fill="#94A3B8" class="font-mono" font-size="12">Autonomous Recovery</text>
    <text x="0" y="90" fill="#64748B" class="font-mono" font-size="11">Sub-Second TTFT Routing</text>
  </g>
</svg>

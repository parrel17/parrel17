<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141922" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>

    <!-- Animated Glow Border -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d">
        <animate attributeName="stop-color" values="#30363d;#38bdf8;#30363d;#818cf8;#30363d" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#30363d;#38bdf8;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#30363d">
        <animate attributeName="stop-color" values="#30363d;#30363d;#38bdf8;#30363d;#30363d" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Scanning Laser -->
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Card Frame -->
  <rect x="1" y="1" width="898" height="158" rx="14" fill="url(#headerBg)" stroke="url(#borderGlow)" stroke-width="1.2" />

  <!-- Animated Top Border Laser -->
  <line x1="20" y1="1" x2="300" y2="1" stroke="url(#laser)" stroke-width="2">
    <animate attributeName="x1" values="-300;900" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x2" values="0;1200" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- Left: Profile Info -->
  <g transform="translate(36, 28)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="108" height="22" rx="11" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#38bdf8" />
    <circle cx="12" cy="11" r="3.5" fill="none" stroke="#38bdf8" stroke-width="1">
      <animate attributeName="r" values="3;8;3" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="15" fill="#7dd3fc" font-size="10" font-weight="600" class="font-mono">AVAILABLE</text>

    <!-- Name & Subtitle -->
    <text x="0" y="56" fill="#f0f6fc" font-size="28" font-weight="700" letter-spacing="-0.5" class="font-sans">Farrel Athallah</text>
    <text x="0" y="80" fill="#8b949e" font-size="14" font-weight="500" class="font-sans">Software Engineer • Systems &amp; Backend</text>
    <text x="0" y="104" fill="#6e7681" font-size="12" font-weight="400" class="font-sans">Building distributed web applications, streaming pipelines, and backend microservices.</text>
  </g>

  <!-- Right: Elegant Geometric Node Art (NOT a server monitor) -->
  <g transform="translate(760, 80)">
    <!-- Rotating outer diamond -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
      <polygon points="0,-42 42,0 0,42 -42,0" fill="none" stroke="#30363d" stroke-width="1.2" />
    </g>

    <!-- Counter-rotating inner diamond -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite" />
      <polygon points="0,-26 26,0 0,26 -26,0" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
      <circle cx="0" cy="-26" r="2.5" fill="#38bdf8" />
      <circle cx="26" cy="0" r="2.5" fill="#38bdf8" />
      <circle cx="0" cy="26" r="2.5" fill="#38bdf8" />
      <circle cx="-26" cy="0" r="2.5" fill="#38bdf8" />
    </g>

    <!-- Center core -->
    <circle cx="0" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;6.5;4" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>

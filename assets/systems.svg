<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="480">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080D1A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Animated Card Glow -->
    <linearGradient id="cyanSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-600,0" to="600,0" dur="6s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-weight: 700; }
    .font-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-weight: 400; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Section Header -->
  <g transform="translate(0, 32)">
    <rect x="0" y="0" width="6" height="24" rx="3" fill="#38BDF8" />
    <text x="18" y="19" fill="#FFFFFF" class="font-title" font-size="20" letter-spacing="-0.5">FLEET SYSTEMS &amp; ARCHITECTURE</text>
    <text x="360" y="19" fill="#64748B" class="font-mono" font-size="12">// PRODUCTION INFRASTRUCTURE</text>
  </g>

  <!-- Bento Grid 2x2 -->

  <!-- CARD 1: 9Router AI Fleet -->
  <g transform="translate(0, 72)">
    <rect x="0" y="0" width="588" height="186" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    <rect x="0" y="0" width="588" height="186" rx="14" fill="none" stroke="url(#cyanSweep)" stroke-width="1.5" />
    
    <g transform="translate(28, 30)">
      <circle cx="10" cy="10" r="10" fill="#0C4A6E" />
      <circle cx="10" cy="10" r="4" fill="#38BDF8" />
      <text x="32" y="15" fill="#FFFFFF" class="font-title" font-size="18">9Router AI Proxy Fleet</text>
      
      <!-- Status Badge -->
      <rect x="420" y="-3" width="92" height="24" rx="12" fill="#064E3B" stroke="#059669" stroke-width="1" />
      <text x="434" y="13" fill="#34D399" class="font-mono" font-size="10" font-weight="700">8 NODES</text>

      <text x="0" y="48" fill="#94A3B8" class="font-body" font-size="13">Distributed multi-account Google AI router with automated Fill-First fallback.</text>
      <text x="0" y="70" fill="#94A3B8" class="font-body" font-size="13">Reroutes all egress traffic through Cloudflare WARP SOCKS5 mesh (&lt;2.4s TTFT).</text>

      <!-- Tags -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="78" height="22" rx="6" fill="#1E293B" />
        <text x="10" y="15" fill="#38BDF8" class="font-mono" font-size="10">Node.js</text>
        <rect x="86" y="0" width="94" height="22" rx="6" fill="#1E293B" />
        <text x="96" y="15" fill="#38BDF8" class="font-mono" font-size="10">WARP Mesh</text>
        <rect x="188" y="0" width="96" height="22" rx="6" fill="#1E293B" />
        <text x="198" y="15" fill="#38BDF8" class="font-mono" font-size="10">Fill-First</text>
      </g>
    </g>
  </g>

  <!-- CARD 2: Nexa Movie Engine -->
  <g transform="translate(612, 72)">
    <rect x="0" y="0" width="588" height="186" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    
    <g transform="translate(28, 30)">
      <circle cx="10" cy="10" r="10" fill="#312E81" />
      <circle cx="10" cy="10" r="4" fill="#818CF8" />
      <text x="32" y="15" fill="#FFFFFF" class="font-title" font-size="18">Nexa Movie Streaming Platform</text>
      
      <!-- Status Badge -->
      <rect x="420" y="-3" width="92" height="24" rx="12" fill="#1E1B4B" stroke="#4338CA" stroke-width="1" />
      <text x="432" y="13" fill="#A5B4FC" class="font-mono" font-size="10" font-weight="700">5 TiB VFS</text>

      <text x="0" y="48" fill="#94A3B8" class="font-body" font-size="13">High-concurrency streaming backend mounted directly to Google Drive cloud VFS.</text>
      <text x="0" y="70" fill="#94A3B8" class="font-body" font-size="13">Real-time HLS transmuxer, TMDB sync pipeline, and frame-rate binary search.</text>

      <!-- Tags -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="70" height="22" rx="6" fill="#1E293B" />
        <text x="10" y="15" fill="#818CF8" class="font-mono" font-size="10">Python</text>
        <rect x="78" y="0" width="60" height="22" rx="6" fill="#1E293B" />
        <text x="88" y="15" fill="#818CF8" class="font-mono" font-size="10">HLS</text>
        <rect x="146" y="0" width="102" height="22" rx="6" fill="#1E293B" />
        <text x="156" y="15" fill="#818CF8" class="font-mono" font-size="10">Rclone VFS</text>
      </g>
    </g>
  </g>

  <!-- CARD 3: Nexa Finance -->
  <g transform="translate(0, 276)">
    <rect x="0" y="0" width="588" height="186" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    
    <g transform="translate(28, 30)">
      <circle cx="10" cy="10" r="10" fill="#064E3B" />
      <circle cx="10" cy="10" r="4" fill="#34D399" />
      <text x="32" y="15" fill="#FFFFFF" class="font-title" font-size="18">Nexa Finance Core</text>
      
      <!-- Status Badge -->
      <rect x="420" y="-3" width="92" height="24" rx="12" fill="#064E3B" stroke="#059669" stroke-width="1" />
      <text x="438" y="13" fill="#34D399" class="font-mono" font-size="10" font-weight="700">ONLINE</text>

      <text x="0" y="48" fill="#94A3B8" class="font-body" font-size="13">High-integrity personal ledger &amp; expense tracking engine built on Next.js.</text>
      <text x="0" y="70" fill="#94A3B8" class="font-body" font-size="13">SQLite WAL storage with 64 MB cache, 256 MB mmap, and cryptographic OTP.</text>

      <!-- Tags -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="76" height="22" rx="6" fill="#1E293B" />
        <text x="10" y="15" fill="#34D399" class="font-mono" font-size="10">Next.js</text>
        <rect x="84" y="0" width="96" height="22" rx="6" fill="#1E293B" />
        <text x="94" y="15" fill="#34D399" class="font-mono" font-size="10">SQLite WAL</text>
        <rect x="188" y="0" width="96" height="22" rx="6" fill="#1E293B" />
        <text x="198" y="15" fill="#34D399" class="font-mono" font-size="10">Helipod</text>
      </g>
    </g>
  </g>

  <!-- CARD 4: Astra Hub & Microservices -->
  <g transform="translate(612, 276)">
    <rect x="0" y="0" width="588" height="186" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    
    <g transform="translate(28, 30)">
      <circle cx="10" cy="10" r="10" fill="#701A75" />
      <circle cx="10" cy="10" r="4" fill="#E879F9" />
      <text x="32" y="15" fill="#FFFFFF" class="font-title" font-size="18">Astra Hub &amp; Microservices</text>
      
      <!-- Status Badge -->
      <rect x="420" y="-3" width="92" height="24" rx="12" fill="#701A75" stroke="#A21CAF" stroke-width="1" />
      <text x="430" y="13" fill="#F0ABFC" class="font-mono" font-size="10" font-weight="700">35s POLL</text>

      <text x="0" y="48" fill="#94A3B8" class="font-body" font-size="13">Event-driven automation fleet coordinating real-time dynamic QRIS validation.</text>
      <text x="0" y="70" fill="#94A3B8" class="font-body" font-size="13">Discord slash-command gateway and 8 background microservices on PM2.</text>

      <!-- Tags -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="102" height="22" rx="6" fill="#1E293B" />
        <text x="10" y="15" fill="#E879F9" class="font-mono" font-size="10">Dynamic QRIS</text>
        <rect x="110" y="0" width="58" height="22" rx="6" fill="#1E293B" />
        <text x="120" y="15" fill="#E879F9" class="font-mono" font-size="10">PM2</text>
        <rect x="176" y="0" width="70" height="22" rx="6" fill="#1E293B" />
        <text x="186" y="15" fill="#E879F9" class="font-mono" font-size="10">REST API</text>
      </g>
    </g>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="336" viewBox="0 0 920 336" role="img" aria-label="Spider-Verse Developer Terminal — Farrel Athallah">
  <defs>
    <pattern id="term-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#38bdf8" opacity="0.11"/>
    </pattern>
    <pattern id="comic-halftone" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#050811" opacity="0.55"/>
    </pattern>
    <radialGradient id="spidey-aura" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#E62429" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#17365C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#060D1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mask-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3340"/>
      <stop offset="52%" stop-color="#D91B24"/>
      <stop offset="100%" stop-color="#7F1017"/>
    </linearGradient>
    <linearGradient id="suit-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F1F4B"/>
    </linearGradient>
    <clipPath id="pane-clip">
      <rect x="16" y="42" width="356" height="280" rx="10"/>
    </clipPath>
    <clipPath id="head-clip">
      <path d="M0,-76 C35,-76 56,-48 54,-10 C52,20 42,46 24,62 Q0,76 -24,62 C-42,46 -52,20 -54,-10 C-56,-48 -35,-76 0,-76 Z"/>
    </clipPath>
    <clipPath id="holo-scan">
      <rect x="16" y="42" width="356" height="0">
        <animate attributeName="height" from="0" to="280" dur="1.4s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
    <filter id="lens-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#EAF2FF" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Terminal Frame -->
  <rect x="0.5" y="0.5" width="919" height="335" rx="14" fill="#060D1A" stroke="#17365C"/>
  <rect x="1" y="1" width="918" height="334" rx="14" fill="url(#term-dots)"/>

  <!-- Titlebar -->
  <path d="M1,15 Q1,1 15,1 L905,1 Q919,1 919,15 L919,32 L1,32 Z" fill="#0B1528"/>
  <line x1="1" y1="32" x2="919" y2="32" stroke="#17365C"/>
  <circle cx="20" cy="16.5" r="5" fill="#E62429"/>
  <circle cx="36" cy="16.5" r="5" fill="#fbbf24"/>
  <circle cx="52" cy="16.5" r="5" fill="#2BD576"/>
  <text x="460" y="20.5" fill="#8B9BB4" font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">parrel17@nexa-vps: ~/spider-sense.sh</text>

  <!-- Left Pane Backdrop + Reticle -->
  <rect x="16" y="42" width="356" height="280" rx="10" fill="#050914" stroke="#17365C" stroke-opacity="0.7"/>
  <circle cx="194" cy="172" r="138" fill="url(#spidey-aura)"/>

  <g clip-path="url(#pane-clip)">
    <!-- Subtle comic background web + HUD corner marks -->
    <g stroke="#38bdf8" stroke-opacity="0.10" stroke-width="0.9" fill="none">
      <circle cx="194" cy="158" r="76" stroke-dasharray="4 6"/>
      <circle cx="194" cy="158" r="108" stroke-dasharray="2 8"/>
      <line x1="194" y1="42" x2="194" y2="322"/>
      <line x1="16" y1="158" x2="372" y2="158"/>
    </g>

    <!-- Hologram Scan-Revealed Spider-Man Bust -->
    <g clip-path="url(#holo-scan)">
      <g transform="translate(194,160)">
        <!-- Chromatic Aberration Glitch Ghost (Cyan / Red offset pulse) -->
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;0.45;0;0.35;0;0" keyTimes="0;0.78;0.80;0.82;0.84;0.86;1" dur="4.2s" repeatCount="indefinite"/>
          <path d="M-4,0 C-39,0 -60,28 -58,66 C-56,96 -46,122 -28,138 Q-4,152 20,138 C38,122 48,96 50,66 C52,28 31,0 -4,0 Z" transform="translate(-4,-76)" fill="#38bdf8"/>
          <path d="M4,0 C-31,0 -52,28 -50,66 C-48,96 -38,122 -20,138 Q4,152 28,138 C46,122 56,96 58,66 C60,28 39,0 4,0 Z" transform="translate(4,-76)" fill="#FF3340"/>
        </g>

        <!-- Shoulders & Suit Torso -->
        <path d="M-136,164 C-130,114 -92,86 -44,74 L-26,48 L26,48 L44,74 C92,86 130,114 136,164 Z" fill="url(#suit-blue)" stroke="#050811" stroke-width="2.5"/>
        <!-- Crimson chest & traps chevron -->
        <path d="M-64,164 L-50,82 L-26,52 L26,52 L50,82 L64,164 Z" fill="url(#mask-grad)" stroke="#050811" stroke-width="2.2"/>
        <!-- Neck shadow under chin -->
        <path d="M-26,48 Q0,78 26,48 L26,74 Q0,92 -26,74 Z" fill="#4C0910"/>

        <!-- Chest Web Lines -->
        <g stroke="#080B14" stroke-width="1.3" fill="none" opacity="0.72">
          <path d="M0,74 L0,164"/>
          <path d="M-18,68 L-34,164"/>
          <path d="M18,68 L34,164"/>
          <path d="M-40,104 Q0,116 40,104"/>
          <path d="M-48,132 Q0,144 48,132"/>
        </g>

        <!-- Chest Spider Emblem Peak -->
        <g fill="#070A12">
          <ellipse cx="0" cy="136" rx="7" ry="12"/>
          <path d="M-4,129 C-16,116 -24,104 -26,90 C-20,102 -12,112 -2,122 Z"/>
          <path d="M4,129 C16,116 24,104 26,90 C20,102 12,112 2,122 Z"/>
          <path d="M-5,134 C-18,128 -28,120 -34,108 C-26,116 -16,124 -5,129 Z"/>
          <path d="M5,134 C18,128 28,120 34,108 C26,116 16,124 5,129 Z"/>
          <path d="M-5,140 C-16,144 -26,154 -30,164 C-22,154 -14,147 -4,144 Z"/>
          <path d="M5,140 C16,144 26,154 30,164 C22,154 14,147 4,144 Z"/>
        </g>

        <!-- Head / Mask Base -->
        <path d="M0,-76 C35,-76 56,-48 54,-10 C52,20 42,46 24,62 Q0,76 -24,62 C-42,46 -52,20 -54,-10 C-56,-48 -35,-76 0,-76 Z" fill="url(#mask-grad)" stroke="#050811" stroke-width="2.8"/>

        <!-- Comic Right-Side Shading + Halftone Dots -->
        <g clip-path="url(#head-clip)">
          <path d="M4,-80 L65,-80 L65,80 L-4,80 C16,52 24,20 22,-14 C20,-46 14,-66 4,-80 Z" fill="#6B0D14" opacity="0.58"/>
          <path d="M10,-80 L65,-80 L65,80 L2,80 C20,50 28,18 26,-16 C24,-48 18,-68 10,-80 Z" fill="url(#comic-halftone)"/>

          <!-- Radial Mask Webbing from Nose Bridge (0, -2) -->
          <g stroke="#070A12" stroke-width="1.35" fill="none" stroke-linecap="round" opacity="0.82">
            <!-- Radial spokes -->
            <path d="M0,-2 L0,-80"/>
            <path d="M0,-2 L-28,-74"/>
            <path d="M0,-2 L28,-74"/>
            <path d="M0,-2 L-54,-46"/>
            <path d="M0,-2 L54,-46"/>
            <path d="M0,-2 L-58,-6"/>
            <path d="M0,-2 L58,-6"/>
            <path d="M0,-2 L-48,36"/>
            <path d="M0,-2 L48,36"/>
            <path d="M0,-2 L-22,68"/>
            <path d="M0,-2 L22,68"/>
            <path d="M0,-2 L0,76"/>
            <!-- Concentric curved web rings -->
            <path d="M-20,-18 Q-10,-14 0,-20 Q10,-14 20,-18"/>
            <path d="M-36,-32 Q-18,-25 0,-36 Q18,-25 36,-32"/>
            <path d="M-50,-44 Q-25,-34 0,-52 Q25,-34 50,-44"/>
            <path d="M-22,18 Q-11,14 0,20 Q11,14 22,18"/>
            <path d="M-38,34 Q-18,26 0,38 Q18,26 38,34"/>
            <path d="M-46,48 Q-22,40 0,56 Q22,40 46,48"/>
          </g>
        </g>

        <!-- Iconic Angular Spider-Man Lenses (Black Rims + Glowing White Lenses) -->
        <g filter="url(#lens-glow)">
          <!-- Left Eye Rim + White Lens -->
          <path d="M-6,-2 C-8,-14 -24,-28 -48,-32 C-52,-14 -44,6 -22,12 C-12,14 -6,8 -6,-2 Z" fill="#050811"/>
          <path d="M-11,-3 C-13,-12 -25,-22 -42,-25 C-44,-12 -38,3 -21,7 C-14,9 -10,4 -11,-3 Z" fill="#F8FAFC">
            <animate attributeName="opacity" values="0.92;1;0.92" dur="2.8s" repeatCount="indefinite"/>
          </path>
          <!-- Right Eye Rim + White Lens -->
          <path d="M6,-2 C8,-14 24,-28 48,-32 C52,-14 44,6 22,12 C12,14 6,8 6,-2 Z" fill="#050811"/>
          <path d="M11,-3 C13,-12 25,-22 42,-25 C44,-12 38,3 21,7 C14,9 10,4 11,-3 Z" fill="#F8FAFC">
            <animate attributeName="opacity" values="0.92;1;0.92" dur="2.8s" repeatCount="indefinite"/>
          </path>
          <!-- Subtle cyan Spider-Verse inner glint -->
          <path d="M-38,-22 C-39,-14 -35,-4 -24,2" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>
          <path d="M38,-22 C39,-14 35,-4 24,2" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>
        </g>
      </g>
    </g>

    <!-- Animated Hologram Laser Sweep -->
    <line x1="24" y1="44" x2="364" y2="44" stroke="#38bdf8" stroke-width="2" opacity="0.85">
      <animate attributeName="y1" values="44;316;44" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="44;316;44" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0.25;0.75" dur="3.6s" repeatCount="indefinite"/>
    </line>

    <!-- Corner HUD Labels inside Portrait Pane -->
    <text x="26" y="59" fill="#38bdf8" font-size="9.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ID // EARTH-616</text>
    <text x="362" y="59" text-anchor="end" fill="#E62429" font-size="9.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SPIDER-SENSE</text>
    <text x="26" y="313" fill="#64748B" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SCAN: ACTIVE</text>
    <text x="362" y="313" text-anchor="end" fill="#64748B" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">920x336 SVG</text>
  </g>

  <!-- Vertical separator -->
  <line x1="388" y1="46" x2="388" y2="318" stroke="#17365C" stroke-dasharray="4 4"/>


fill="#475569" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">::</text><text x="512" y="168" fill="#EAF2FF" font-size="12" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Nexa Movie · Nexa Finance · Astra</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.25s" fill="freeze"/><text x="410" y="192" fill="#E62429" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">stack   </text><text x="488" y="192" fill="#475569" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">::</text><text x="512" y="192" fill="#EAF2FF" font-size="12" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TypeScript · Python · Node.js · SQLite · Nginx</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.25s" dur="0.25s" fill="freeze"/><text x="410" y="216" fill="#E62429" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">infra   </text><text x="488" y="216" fill="#475569" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">::</text><text x="512" y="216" fill="#94A3B8" font-size="12" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Linux VPS · Nginx · SQLite WAL · PM2</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.45s" dur="0.25s" fill="freeze"/><text x="410" y="240" fill="#E62429" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">mode    </text><text x="488" y="240" fill="#475569" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">::</text><text x="512" y="240" fill="#E62429" font-size="12" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Spider-Sense Active // Craft over speed</text></g>

  <!-- Dot-Matrix Swatches + Blinking Prompt -->
  <rect x="410" y="274" width="18" height="10" rx="3" fill="#050B16" stroke="#1e293b" stroke-width="0.6"><animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></rect><rect x="436" y="274" width="18" height="10" rx="3" fill="#17365C" stroke="#1e293b" stroke-width="0.6"><animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></rect><rect x="462" y="274" width="18" height="10" rx="3" fill="#E62429" stroke="#1e293b" stroke-width="0.6"><animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></rect><rect x="488" y="274" width="18" height="10" rx="3" fill="#FF3340" stroke="#1e293b" stroke-width="0.6"><animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect><rect x="514" y="274" width="18" height="10" rx="3" fill="#38bdf8" stroke="#1e293b" stroke-width="0.6"><animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></rect><rect x="540" y="274" width="18" height="10" rx="3" fill="#EAF2FF" stroke="#1e293b" stroke-width="0.6"><animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" begin="1.0s" repeatCount="indefinite"/></rect>
  <text x="410" y="310" fill="#8B9BB4" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">parrel17@nexa:~$ <tspan fill="#EAF2FF">./deploy --spider-verse</tspan></text>

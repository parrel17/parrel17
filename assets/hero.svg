<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#04070D" />
    </linearGradient>

    <!-- Border Glow Gradient with Sliding Animation -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.4" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-1200,0" to="1200,0" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Card Mesh Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>

    <!-- Text Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif; font-weight: 500; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
    
    @keyframes pulseFade {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    @keyframes scanMove {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    .scanning-line { animation: scanMove 4s ease-in-out infinite; }
    .pulse-glow { animation: pulseFade 3s ease-in-out infinite; }
    .cursor { animation: cursorBlink 0.9s infinite; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="1196" height="376" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5" />
  <rect x="2" y="2" width="1196" height="376" rx="16" fill="url(#grid)" />

  <!-- Animated Border Glow -->
  <rect x="2" y="2" width="1196" height="376" rx="16" fill="none" stroke="url(#borderGlow)" stroke-width="2" />

  <!-- Scanning Cyber Beam -->
  <line x1="10" y1="0" x2="1190" y2="0" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" class="scanning-line" />

  <!-- Decorative Top Bar -->
  <g transform="translate(48, 42)">
    <!-- Status Pill with Animated Ripple -->
    <rect x="0" y="0" width="175" height="32" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="18" cy="16" r="4.5" fill="#10B981" />
    <circle cx="18" cy="16" r="4.5" fill="none" stroke="#10B981" stroke-width="1.5">
      <animate attributeName="r" values="4.5;12;4.5" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" fill="#E2E8F0" class="font-mono" font-size="11" font-weight="600" letter-spacing="0.5">FLEET : ONLINE</text>

    <!-- Node Location Pill -->
    <rect x="188" y="0" width="185" height="32" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="206" cy="16" r="4" fill="#38BDF8" />
    <text x="220" y="21" fill="#94A3B8" class="font-mono" font-size="11" font-weight="500">HOST : SUMOPOD VPS</text>

    <!-- Egress Pill -->
    <rect x="386" y="0" width="195" height="32" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="404" cy="16" r="4" fill="#818CF8" />
    <text x="418" y="21" fill="#94A3B8" class="font-mono" font-size="11" font-weight="500">MESH : WARP ANYCAST</text>
  </g>

  <!-- Name & Title -->
  <g transform="translate(48, 140)">
    <text x="0" y="0" fill="#FFFFFF" class="font-title" font-size="44" letter-spacing="-1">Farrel Athallah</text>
    <text x="0" y="32" fill="#38BDF8" class="font-sub" font-size="18" font-weight="600" letter-spacing="0.2">Systems &amp; Backend Software Engineer</text>
    
    <!-- Animated Terminal Statement Line -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="700" height="38" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="24" fill="#38BDF8" class="font-mono" font-size="13" font-weight="600">&gt;</text>
      <text x="36" y="24" fill="#CBD5E1" class="font-mono" font-size="13">Architecting distributed proxy fleets, 5 TiB VFS streaming, and autonomous agents.</text>
      <rect x="680" y="10" width="8" height="18" fill="#38BDF8" class="cursor" />
    </g>
  </g>

  <!-- Right Graphic: 1080p High-DPI Tech Ring Core -->
  <g transform="translate(1000, 190)">
    <!-- Outer Orbit 1 -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite" />
    </circle>
    <!-- Outer Orbit 2 -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="24 16">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite" />
    </circle>
    <!-- Mid Hexagon / Core Ring -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#818CF8" stroke-width="1.8" stroke-opacity="0.8" />
    <!-- Pulsing Center Node -->
    <circle cx="0" cy="0" r="28" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#38BDF8" class="pulse-glow" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />

    <!-- Orbiting Satellites -->
    <circle cx="80" cy="0" r="5" fill="#38BDF8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="-55" cy="0" r="4" fill="#818CF8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Bottom Telemetry Chips -->
  <g transform="translate(48, 282)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="135" height="42" rx="10" fill="#0D1526" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="26" fill="#94A3B8" class="font-mono" font-size="11">LATENCY : </text>
      <text x="80" y="26" fill="#38BDF8" class="font-mono" font-size="11" font-weight="700">&lt;2.4s</text>
    </g>
    <g transform="translate(147, 0)">
      <rect x="0" y="0" width="150" height="42" rx="10" fill="#0D1526" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="26" fill="#94A3B8" class="font-mono" font-size="11">AI NODES : </text>
      <text x="86" y="26" fill="#10B981" class="font-mono" font-size="11" font-weight="700">8 ACTIVE</text>
    </g>
    <g transform="translate(309, 0)">
      <rect x="0" y="0" width="155" height="42" rx="10" fill="#0D1526" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="26" fill="#94A3B8" class="font-mono" font-size="11">STORAGE : </text>
      <text x="88" y="26" fill="#A855F7" class="font-mono" font-size="11" font-weight="700">5 TiB VFS</text>
    </g>
    <g transform="translate(476, 0)">
      <rect x="0" y="0" width="170" height="42" rx="10" fill="#0D1526" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="26" fill="#94A3B8" class="font-mono" font-size="11">UPSTREAM : </text>
      <text x="96" y="26" fill="#F59E0B" class="font-mono" font-size="11" font-weight="700">WARP MESH</text>
    </g>
  </g>
</svg>

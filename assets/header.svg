<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A" />
      <stop offset="50%" stop-color="#0E1217" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#B2D5E5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#ECEAE4" />
      <stop offset="100%" stop-color="#B2D5E5" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 800; font-size: 38px; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 500; font-size: 14px; letter-spacing: 2px; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 400; font-size: 13px; fill: #94A3B8; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; font-size: 11px; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.5px; }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="240" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow in Top Left and Top Right -->
  <circle cx="120" cy="50" r="140" fill="url(#glowGrad)" />
  <circle cx="800" cy="180" r="120" fill="url(#glowGrad)" />

  <!-- Card Border -->
  <rect x="1" y="1" width="898" height="238" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Status Indicator Badge (Top Right) -->
  <g transform="translate(680, 24)">
    <rect width="185" height="28" rx="14" fill="#0D1520" stroke="#1E293B" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10B981" />
    <circle cx="16" cy="14" r="7.5" fill="#10B981" fill-opacity="0.25" />
    <text x="32" y="18" fill="#E2E8F0" class="pill-text">FLEET STATUS: ONLINE</text>
  </g>

  <!-- Circular Emblem 'N' (Left) -->
  <g transform="translate(48, 52)">
    <!-- Outer Rings -->
    <circle cx="48" cy="48" r="48" fill="#0A0A0A" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="48" cy="48" r="42" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="4 2" />
    
    <!-- Stylized 'N' Minimalist Geometry -->
    <path d="M 33 66 L 33 30 L 41 30 L 55 54 L 55 30 L 63 30 L 63 66 L 55 66 L 41 42 L 41 66 Z" fill="url(#textGrad)" />
  </g>

  <!-- Main Info Block -->
  <g transform="translate(170, 72)">
    <!-- Subtitle / Eyebrow -->
    <text x="0" y="0" fill="#38BDF8" class="subtitle">SYSTEMS ARCHITECT &amp; DISTRIBUTED BACKEND</text>
    
    <!-- Primary Heading -->
    <text x="0" y="38" fill="url(#textGrad)" class="title">Farrel Athallah</text>
    
    <!-- Core Description Line -->
    <text x="0" y="68" class="desc">Engineering autonomous AI gateways, VFS media pipelines, and ultra-low latency infrastructure.</text>
    
    <!-- Tags / Tech Indicators -->
    <g transform="translate(0, 94)">
      <rect x="0" y="0" width="82" height="22" rx="4" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
      <text x="41" y="15" fill="#B2D5E5" class="mono" text-anchor="middle">PYTHON</text>

      <rect x="90" y="0" width="100" height="22" rx="4" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
      <text x="140" y="15" fill="#B2D5E5" class="mono" text-anchor="middle">TYPESCRIPT</text>

      <rect x="198" y="0" width="75" height="22" rx="4" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
      <text x="235.5" y="15" fill="#B2D5E5" class="mono" text-anchor="middle">SQLITE</text>

      <rect x="281" y="0" width="145" height="22" rx="4" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
      <text x="353.5" y="15" fill="#B2D5E5" class="mono" text-anchor="middle">WARP ANYCAST MESH</text>

      <rect x="434" y="0" width="95" height="22" rx="4" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
      <text x="481.5" y="15" fill="#B2D5E5" class="mono" text-anchor="middle">ZERO SLOP</text>
    </g>
  </g>
</svg>
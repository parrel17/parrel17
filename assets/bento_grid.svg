<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="440">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f141c" />
    </linearGradient>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- ==================== CARD 1: 9ROUTER AI (Top-Left) ==================== -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="438" height="208" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2" />
    
    <!-- Icon Container -->
    <rect x="24" y="22" width="42" height="42" rx="10" fill="url(#iconGlow)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <!-- Network Router SVG Icon -->
    <g transform="translate(33, 31)" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="2" width="22" height="8" rx="2" />
      <path d="M5 10v6M12 10v6M19 10v6" />
      <circle cx="5" cy="18" r="2" fill="#38bdf8" />
      <circle cx="12" cy="18" r="2" fill="#38bdf8" />
      <circle cx="19" cy="18" r="2" fill="#38bdf8" />
    </g>

    <!-- Title & Badge -->
    <text x="78" y="40" fill="#f0f6fc" font-size="17" font-weight="700" class="font-sans">9Router AI Gateway</text>
    <rect x="78" y="48" width="124" height="18" rx="9" fill="#0d1117" stroke="#238636" stroke-width="1" />
    <circle cx="86" cy="57" r="3" fill="#2ea043" />
    <text x="94" y="61" fill="#7ee787" font-size="10" font-weight="600" class="font-mono">8 NODES • FILL-FIRST</text>

    <!-- Description -->
    <text x="24" y="98" fill="#8b949e" font-size="12" class="font-sans">High-throughput proxy orchestrating multi-account upstream</text>
    <text x="24" y="116" fill="#8b949e" font-size="12" class="font-sans">APIs with Cloudflare WARP mesh and automated failover.</text>

    <!-- Tech Badges -->
    <g transform="translate(24, 150)">
      <rect x="0" y="0" width="68" height="22" rx="6" fill="#21262d" />
      <text x="34" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Node.js</text>
      
      <rect x="76" y="0" width="88" height="22" rx="6" fill="#21262d" />
      <text x="120" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">WARP Mesh</text>
      
      <rect x="172" y="0" width="62" height="22" rx="6" fill="#21262d" />
      <text x="203" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">SOCKS5</text>
      
      <rect x="242" y="0" width="68" height="22" rx="6" fill="#21262d" />
      <text x="276" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Next.js</text>
    </g>
  </g>

  <!-- ==================== CARD 2: NEXA MOVIE (Top-Right) ==================== -->
  <g transform="translate(462, 0)">
    <rect x="0" y="0" width="438" height="208" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2" />
    
    <!-- Icon Container -->
    <rect x="24" y="22" width="42" height="42" rx="10" fill="url(#iconGlow)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <!-- Video Player SVG Icon -->
    <g transform="translate(33, 31)" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="16" rx="3" />
      <polygon points="10 8 16 11 10 14 10 8" fill="#38bdf8" />
    </g>

    <!-- Title & Badge -->
    <text x="78" y="40" fill="#f0f6fc" font-size="17" font-weight="700" class="font-sans">Nexa Movie Engine</text>
    <rect x="78" y="48" width="128" height="18" rx="9" fill="#0d1117" stroke="#1f6feb" stroke-width="1" />
    <circle cx="86" cy="57" r="3" fill="#388bfd" />
    <text x="94" y="61" fill="#79c0ff" font-size="10" font-weight="600" class="font-mono">5 TiB VFS MOUNTED</text>

    <!-- Description -->
    <text x="24" y="98" fill="#8b949e" font-size="12" class="font-sans">Cloud VFS media platform with custom HLS transmuxing,</text>
    <text x="24" y="116" fill="#8b949e" font-size="12" class="font-sans">sub-second audio sync, and zero-slop TMDB pipelines.</text>

    <!-- Tech Badges -->
    <g transform="translate(24, 150)">
      <rect x="0" y="0" width="62" height="22" rx="6" fill="#21262d" />
      <text x="31" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Python</text>
      
      <rect x="70" y="0" width="88" height="22" rx="6" fill="#21262d" />
      <text x="114" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Rclone VFS</text>
      
      <rect x="166" y="0" width="86" height="22" rx="6" fill="#21262d" />
      <text x="209" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">HLS Stream</text>
      
      <rect x="260" y="0" width="56" height="22" rx="6" fill="#21262d" />
      <text x="288" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Nginx</text>
    </g>
  </g>

  <!-- ==================== CARD 3: NEXA FINANCE (Bottom-Left) ==================== -->
  <g transform="translate(0, 232)">
    <rect x="0" y="0" width="438" height="208" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2" />
    
    <!-- Icon Container -->
    <rect x="24" y="22" width="42" height="42" rx="10" fill="url(#iconGlow)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <!-- Vault / Finance SVG Icon -->
    <g transform="translate(33, 31)" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="14" rx="2" />
      <line x1="2" y1="9" x2="22" y2="9" />
      <circle cx="6" cy="14" r="1.5" fill="#38bdf8" />
    </g>

    <!-- Title & Badge -->
    <text x="78" y="40" fill="#f0f6fc" font-size="17" font-weight="700" class="font-sans">Nexa Finance Core</text>
    <rect x="78" y="48" width="134" height="18" rx="9" fill="#0d1117" stroke="#8957e5" stroke-width="1" />
    <circle cx="86" cy="57" r="3" fill="#a371f7" />
    <text x="94" y="61" fill="#d2a8ff" font-size="10" font-weight="600" class="font-mono">SQLITE WAL • 64M CACHE</text>

    <!-- Description -->
    <text x="24" y="98" fill="#8b949e" font-size="12" class="font-sans">High-performance transactional personal expense engine</text>
    <text x="24" y="116" fill="#8b949e" font-size="12" class="font-sans">with transient OTP verification and zero external telemetry.</text>

    <!-- Tech Badges -->
    <g transform="translate(24, 150)">
      <rect x="0" y="0" width="68" height="22" rx="6" fill="#21262d" />
      <text x="34" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Next.js</text>
      
      <rect x="76" y="0" width="86" height="22" rx="6" fill="#21262d" />
      <text x="119" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">SQLite WAL</text>
      
      <rect x="170" y="0" width="88" height="22" rx="6" fill="#21262d" />
      <text x="214" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">TailwindCSS</text>
      
      <rect x="266" y="0" width="62" height="22" rx="6" fill="#21262d" />
      <text x="297" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Resend</text>
    </g>
  </g>

  <!-- ==================== CARD 4: ASTRA ECOSYSTEM (Bottom-Right) ==================== -->
  <g transform="translate(462, 232)">
    <rect x="0" y="0" width="438" height="208" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2" />
    
    <!-- Icon Container -->
    <rect x="24" y="22" width="42" height="42" rx="10" fill="url(#iconGlow)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <!-- Bot / Automation SVG Icon -->
    <g transform="translate(33, 31)" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="9" width="18" height="11" rx="2" />
      <circle cx="8" cy="14" r="1.5" fill="#38bdf8" />
      <circle cx="16" cy="14" r="1.5" fill="#38bdf8" />
      <path d="M8 5a4 4 0 0 1 8 0v4H8V5z" />
    </g>

    <!-- Title & Badge -->
    <text x="78" y="40" fill="#f0f6fc" font-size="17" font-weight="700" class="font-sans">Astra Automation Fleet</text>
    <rect x="78" y="48" width="124" height="18" rx="9" fill="#0d1117" stroke="#da3633" stroke-width="1" />
    <circle cx="86" cy="57" r="3" fill="#f85149" />
    <text x="94" y="61" fill="#ff7b72" font-size="10" font-weight="600" class="font-mono">PM2 MULTI-BOT</text>

    <!-- Description -->
    <text x="24" y="98" fill="#8b949e" font-size="12" class="font-sans">Event-driven Discord microservices orchestrating autonomous</text>
    <text x="24" y="116" fill="#8b949e" font-size="12" class="font-sans">35s QRIS payment verification and cluster health polling.</text>

    <!-- Tech Badges -->
    <g transform="translate(24, 150)">
      <rect x="0" y="0" width="78" height="22" rx="6" fill="#21262d" />
      <text x="39" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Discord.js</text>
      
      <rect x="86" y="0" width="56" height="22" rx="6" fill="#21262d" />
      <text x="114" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">PM2</text>
      
      <rect x="150" y="0" width="82" height="22" rx="6" fill="#21262d" />
      <text x="191" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">QRIS Poller</text>
      
      <rect x="240" y="0" width="76" height="22" rx="6" fill="#21262d" />
      <text x="278" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">REST API</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="440">
  <defs>
    <!-- Background Gradient for Cards -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141922" />
      <stop offset="100%" stop-color="#0c0f16" />
    </linearGradient>

    <!-- Animated Shimmer Beam for Cards -->
    <linearGradient id="laserCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="laserEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="laserPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="laserAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <!-- Card Icon Glows -->
    <radialGradient id="iconGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="iconGlowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="iconGlowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="iconGlowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- ==================== CARD 1: 9ROUTER (Top-Left) ==================== -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="438" height="208" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" />
    
    <!-- Animated Top Edge Pulse -->
    <line x1="20" y1="1" x2="160" y2="1" stroke="url(#laserCyan)" stroke-width="2">
      <animate attributeName="x1" values="-150;440" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0;590" dur="3.5s" repeatCount="indefinite" />
    </line>

    <!-- Icon Container with Animated Glow -->
    <rect x="24" y="22" width="42" height="42" rx="10" fill="url(#iconGlowCyan)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <g transform="translate(33, 31)" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="2" width="22" height="8" rx="2" />
      <path d="M5 10v6M12 10v6M19 10v6" />
      <circle cx="5" cy="18" r="2" fill="#38bdf8" />
      <circle cx="12" cy="18" r="2" fill="#38bdf8" />
      <circle cx="19" cy="18" r="2" fill="#38bdf8" />
    </g>

    <!-- Title & Animated Badge -->
    <text x="78" y="40" fill="#f0f6fc" font-size="17" font-weight="700" class="font-sans">9Router Gateway</text>
    <rect x="78" y="48" width="108" height="18" rx="9" fill="#0d1117" stroke="#238636" stroke-width="1" />
    
    <!-- Animated Ping Dot -->
    <circle cx="86" cy="57" r="3" fill="#2ea043" />
    <circle cx="86" cy="57" r="3" fill="none" stroke="#2ea043" stroke-width="1">
      <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <text x="96" y="61" fill="#7ee787" font-size="10" font-weight="600" class="font-mono">REVERSE PROXY</text>

    <!-- Description -->
    <text x="24" y="98" fill="#8b949e" font-size="12" class="font-sans">High-concurrency API routing proxy with dynamic request</text>
    <text x="24" y="116" fill="#8b949e" font-size="12" class="font-sans">hedging, automated upstream failover, and low-latency transport.</text>

    <!-- Tech Badges -->
    <g transform="translate(24, 150)">
      <rect x="0" y="0" width="68" height="22" rx="6" fill="#1f242c" />
      <text x="34" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Node.js</text>
      
      <rect x="76" y="0" width="82" height="22" rx="6" fill="#1f242c" />
      <text x="117" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">TypeScript</text>
      
      <rect x="166" y="0" width="62" height="22" rx="6" fill="#1f242c" />
      <text x="197" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">SOCKS5</text>
      
      <rect x="236" y="0" width="68" height="22" rx="6" fill="#1f242c" />
      <text x="270" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Next.js</text>
    </g>
  </g>

  <!-- ==================== CARD 2: NEXA MOVIE (Top-Right) ==================== -->
  <g transform="translate(462, 0)">
    <rect x="0" y="0" width="438" height="208" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" />
    
    <!-- Animated Top Edge Pulse -->
    <line x1="20" y1="1" x2="160" y2="1" stroke="url(#laserEmerald)" stroke-width="2">
      <animate attributeName="x1" values="-150;440" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0;590" dur="4s" repeatCount="indefinite" />
    </line>

    <!-- Icon Container -->
    <rect x="24" y="22" width="42" height="42" rx="10" fill="url(#iconGlowEmerald)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <g transform="translate(33, 31)" stroke="#10b981" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="16" rx="3" />
      <polygon points="10 8 16 11 10 14 10 8" fill="#10b981" />
    </g>

    <!-- Title & Animated Badge -->
    <text x="78" y="40" fill="#f0f6fc" font-size="17" font-weight="700" class="font-sans">Nexa Movie Engine</text>
    <rect x="78" y="48" width="138" height="18" rx="9" fill="#0d1117" stroke="#1f6feb" stroke-width="1" />
    
    <circle cx="86" cy="57" r="3" fill="#388bfd" />
    <circle cx="86" cy="57" r="3" fill="none" stroke="#388bfd" stroke-width="1">
      <animate attributeName="r" values="3;7;3" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    
    <text x="96" y="61" fill="#79c0ff" font-size="10" font-weight="600" class="font-mono">STREAMING PLATFORM</text>

    <!-- Description -->
    <text x="24" y="98" fill="#8b949e" font-size="12" class="font-sans">Cloud media streaming web platform featuring custom HLS</text>
    <text x="24" y="116" fill="#8b949e" font-size="12" class="font-sans">transmuxing, sub-second audio sync, and automated TMDB pipeline.</text>

    <!-- Tech Badges -->
    <g transform="translate(24, 150)">
      <rect x="0" y="0" width="62" height="22" rx="6" fill="#1f242c" />
      <text x="31" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Python</text>
      
      <rect x="70" y="0" width="88" height="22" rx="6" fill="#1f242c" />
      <text x="114" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Rclone VFS</text>
      
      <rect x="166" y="0" width="86" height="22" rx="6" fill="#1f242c" />
      <text x="209" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">HLS Stream</text>
      
      <rect x="260" y="0" width="56" height="22" rx="6" fill="#1f242c" />
      <text x="288" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Nginx</text>
    </g>
  </g>

  <!-- ==================== CARD 3: NEXA FINANCE (Bottom-Left) ==================== -->
  <g transform="translate(0, 232)">
    <rect x="0" y="0" width="438" height="208" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" />
    
    <!-- Animated Top Edge Pulse -->
    <line x1="20" y1="1" x2="160" y2="1" stroke="url(#laserPurple)" stroke-width="2">
      <animate attributeName="x1" values="-150;440" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0;590" dur="4.2s" repeatCount="indefinite" />
    </line>

    <!-- Icon Container -->
    <rect x="24" y="22" width="42" height="42" rx="10" fill="url(#iconGlowPurple)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
    <g transform="translate(33, 31)" stroke="#a855f7" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="14" rx="2" />
      <line x1="2" y1="9" x2="22" y2="9" />
      <circle cx="6" cy="14" r="1.5" fill="#a855f7" />
    </g>

    <!-- Title & Animated Badge -->
    <text x="78" y="40" fill="#f0f6fc" font-size="17" font-weight="700" class="font-sans">Nexa Finance Core</text>
    <rect x="78" y="48" width="124" height="18" rx="9" fill="#0d1117" stroke="#8957e5" stroke-width="1" />
    
    <circle cx="86" cy="57" r="3" fill="#a371f7" />
    <circle cx="86" cy="57" r="3" fill="none" stroke="#a371f7" stroke-width="1">
      <animate attributeName="r" values="3;7;3" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    
    <text x="96" y="61" fill="#d2a8ff" font-size="10" font-weight="600" class="font-mono">PERSONAL LEDGER</text>

    <!-- Description -->
    <text x="24" y="98" fill="#8b949e" font-size="12" class="font-sans">Clean personal finance application with high-performance</text>
    <text x="24" y="116" fill="#8b949e" font-size="12" class="font-sans">SQLite storage, transient OTP verification, and zero telemetry.</text>

    <!-- Tech Badges -->
    <g transform="translate(24, 150)">
      <rect x="0" y="0" width="68" height="22" rx="6" fill="#1f242c" />
      <text x="34" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Next.js</text>
      
      <rect x="76" y="0" width="86" height="22" rx="6" fill="#1f242c" />
      <text x="119" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">SQLite WAL</text>
      
      <rect x="170" y="0" width="88" height="22" rx="6" fill="#1f242c" />
      <text x="214" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">TailwindCSS</text>
      
      <rect x="266" y="0" width="62" height="22" rx="6" fill="#1f242c" />
      <text x="297" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Resend</text>
    </g>
  </g>

  <!-- ==================== CARD 4: ASTRA ECOSYSTEM (Bottom-Right) ==================== -->
  <g transform="translate(462, 232)">
    <rect x="0" y="0" width="438" height="208" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" />
    
    <!-- Animated Top Edge Pulse -->
    <line x1="20" y1="1" x2="160" y2="1" stroke="url(#laserAmber)" stroke-width="2">
      <animate attributeName="x1" values="-150;440" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0;590" dur="3.8s" repeatCount="indefinite" />
    </line>

    <!-- Icon Container -->
    <rect x="24" y="22" width="42" height="42" rx="10" fill="url(#iconGlowAmber)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
    <g transform="translate(33, 31)" stroke="#f59e0b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="9" width="18" height="11" rx="2" />
      <circle cx="8" cy="14" r="1.5" fill="#f59e0b" />
      <circle cx="16" cy="14" r="1.5" fill="#f59e0b" />
      <path d="M8 5a4 4 0 0 1 8 0v4H8V5z" />
    </g>

    <!-- Title & Animated Badge -->
    <text x="78" y="40" fill="#f0f6fc" font-size="17" font-weight="700" class="font-sans">Astra Automation Fleet</text>
    <rect x="78" y="48" width="134" height="18" rx="9" fill="#0d1117" stroke="#da3633" stroke-width="1" />
    
    <circle cx="86" cy="57" r="3" fill="#f85149" />
    <circle cx="86" cy="57" r="3" fill="none" stroke="#f85149" stroke-width="1">
      <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <text x="96" y="61" fill="#ff7b72" font-size="10" font-weight="600" class="font-mono">EVENT MICROSERVICE</text>

    <!-- Description -->
    <text x="24" y="98" fill="#8b949e" font-size="12" class="font-sans">Modular event-driven microservices orchestrating automated</text>
    <text x="24" y="116" fill="#8b949e" font-size="12" class="font-sans">QRIS payment verification, Discord gateways, and health polling.</text>

    <!-- Tech Badges -->
    <g transform="translate(24, 150)">
      <rect x="0" y="0" width="78" height="22" rx="6" fill="#1f242c" />
      <text x="39" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">Discord.js</text>
      
      <rect x="86" y="0" width="56" height="22" rx="6" fill="#1f242c" />
      <text x="114" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">PM2</text>
      
      <rect x="150" y="0" width="82" height="22" rx="6" fill="#1f242c" />
      <text x="191" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">QRIS Poller</text>
      
      <rect x="240" y="0" width="76" height="22" rx="6" fill="#1f242c" />
      <text x="278" y="15" fill="#c9d1d9" font-size="10" font-weight="500" text-anchor="middle" class="font-mono">REST API</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" width="100%" role="img" aria-label="Systems Architecture — Spider-Sense Bento Grid">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060D1A" />
      <stop offset="100%" stop-color="#091326" />
    </linearGradient>

    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B172A" />
      <stop offset="100%" stop-color="#07101F" />
    </linearGradient>

    <linearGradient id="laserRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E62429" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF3340" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E62429" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="laserBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1976D2" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1976D2" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E62429" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#E62429" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <clipPath id="outerClip">
      <rect x="0.5" y="0.5" width="899" height="491" rx="14" />
    </clipPath>
  </defs>

  <style>
    .font-display { font-family: "Inter Display", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <g clip-path="url(#outerClip)">
    <!-- Outer Spider-Verse Canvas -->
    <rect width="900" height="492" fill="url(#canvasBg)" />

    <!-- Faint Spider-Web Network Geometry -->
    <g stroke="#EAF2FF" stroke-opacity="0.045" stroke-width="1" fill="none">
      <line x1="0" y1="0" x2="900" y2="492" />
      <line x1="900" y1="0" x2="0" y2="492" />
      <line x1="450" y1="0" x2="450" y2="492" />
      <line x1="0" y1="265" x2="900" y2="265" />
      <circle cx="450" cy="265" r="145" />
      <circle cx="450" cy="265" r="275" />
      <circle cx="450" cy="265" r="410" />
    </g>

    <!-- HUD Top Header -->
    <g transform="translate(28, 30)">
      <path d="M0,-8 L2,-4 L1.5,-1 L3.5,2 L2.5,6 L0,10 L-2.5,6 L-3.5,2 L-1.5,-1 L-2,-4 Z" fill="#E62429" />
      <g stroke="#E62429" stroke-width="1.3" stroke-linecap="round" fill="none">
        <path d="M-2.5,-3 L-8,-8" /><path d="M-3,0 L-10,-2" /><path d="M-3,3 L-9,7" />
        <path d="M2.5,-3 L8,-8" /><path d="M3,0 L10,-2" /><path d="M3,3 L9,7" />
      </g>
    </g>

    <text x="50" y="36" fill="#EAF2FF" font-size="16" font-weight="800" letter-spacing="2" class="font-display">SYSTEMS ARCHITECTURE</text>
    <text x="292" y="35.5" fill="#7D8FA8" font-size="10.5" font-weight="600" letter-spacing="1.8" class="font-mono">// ACTIVE MISSIONS</text>

    <!-- Right HUD Pill -->
    <g transform="translate(744, 19)">
      <rect x="0" y="0" width="138" height="22" rx="11" fill="#0A1424" stroke="#17365C" stroke-width="1" />
      <circle cx="13" cy="11" r="3" fill="#2BD576">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="13" cy="11" r="3" fill="none" stroke="#2BD576" stroke-width="1">
        <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="14.5" fill="#9FB3CC" font-size="9.5" font-weight="600" letter-spacing="1.2" class="font-mono">4 NODES ONLINE</text>
    </g>

    <!-- ==================== CARD 1: 9ROUTER GATEWAY (Top-Left, Crimson) ==================== -->
    <g transform="translate(18, 58)">
      <rect x="0" y="0" width="423" height="198" rx="12" fill="url(#cardSurface)" stroke="#17365C" stroke-width="1.2" />
      <rect x="1" y="0" width="421" height="2.5" rx="1.2" fill="#E62429" fill-opacity="0.85" />
      <line x1="0" y1="1.2" x2="140" y2="1.2" stroke="url(#laserRed)" stroke-width="2.2">
        <animate attributeName="x1" values="-140;423" dur="3.6s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0;563" dur="3.6s" repeatCount="indefinite" />
      </line>

      <!-- Subtle bottom-right corner web -->
      <g transform="translate(392, 167)" fill="none" stroke="#E62429" stroke-opacity="0.18" stroke-width="1">
        <path d="M31,0 L0,31" /><path d="M31,10 L10,31" /><path d="M31,20 L20,31" />
        <path d="M0,31 A31,31 0 0 1 31,0" />
      </g>

      <rect x="22" y="22" width="40" height="40" rx="10" fill="url(#glowRed)" stroke="#E62429" stroke-opacity="0.45" stroke-width="1" />
      <g transform="translate(30, 30)" stroke="#FF3340" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="2" width="22" height="8" rx="2" />
        <path d="M5 10v6M12 10v6M19 10v6" />
        <circle cx="5" cy="18" r="2" fill="#FF3340" />
        <circle cx="12" cy="18" r="2" fill="#FF3340" />
        <circle cx="19" cy="18" r="2" fill="#FF3340" />
      </g>

      <text x="74" y="39" fill="#EAF2FF" font-size="16.5" font-weight="700" class="font-display">9Router Gateway</text>
      <rect x="74" y="47" width="114" height="18" rx="9" fill="#180B10" stroke="#E62429" stroke-opacity="0.65" stroke-width="1" />
      <circle cx="83" cy="56" r="2.8" fill="#FF3340" />
      <circle cx="83" cy="56" r="2.8" fill="none" stroke="#FF3340" stroke-width="1">
        <animate attributeName="r" values="2.8;6.8;2.8" dur="2.1s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.9;0;0.9" dur="2.1s" repeatCount="indefinite" />
      </circle>
      <text x="93" y="59.5" fill="#FF7B82" font-size="9.5" font-weight="600" letter-spacing="0.8" class="font-mono">REVERSE PROXY</text>

      <text x="22" y="94" fill="#9FB3CC" font-size="11.5" class="font-display">High-concurrency API routing proxy with dynamic request</text>
      <text x="22" y="112" fill="#9FB3CC" font-size="11.5" class="font-display">hedging, automated upstream failover, and low-latency transport.</text>

      <g transform="translate(22, 148)">
        <rect x="0" y="0" width="66" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="33" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">Node.js</text>

        <rect x="74" y="0" width="80" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="114" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">TypeScript</text>

        <rect x="162" y="0" width="60" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="192" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">SOCKS5</text>

        <rect x="230" y="0" width="66" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="263" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">Next.js</text>
      </g>
    </g>

    <!-- ==================== CARD 2: NEXA MOVIE ENGINE (Top-Right, Cobalt Blue) ==================== -->
    <g transform="translate(459, 58)">
      <rect x="0" y="0" width="423" height="198" rx="12" fill="url(#cardSurface)" stroke="#17365C" stroke-width="1.2" />
      <rect x="1" y="0" width="421" height="2.5" rx="1.2" fill="#1976D2" fill-opacity="0.9" />
      <line x1="0" y1="1.2" x2="140" y2="1.2" stroke="url(#laserBlue)" stroke-width="2.2">
        <animate attributeName="x1" values="-140;423" dur="4.1s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0;563" dur="4.1s" repeatCount="indefinite" />
      </line>

      <g transform="translate(392, 167)" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1">
        <path d="M31,0 L0,31" /><path d="M31,10 L10,31" /><path d="M31,20 L20,31" />
        <path d="M0,31 A31,31 0 0 1 31,0" />
      </g>

      <rect x="22" y="22" width="40" height="40" rx="10" fill="url(#glowBlue)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1" />

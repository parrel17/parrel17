        <rect x="2" y="3" width="20" height="16" rx="3" />
        <polygon points="10 8 16 11 10 14 10 8" fill="#38bdf8" />
      </g>

      <text x="74" y="39" fill="#EAF2FF" font-size="16.5" font-weight="700" class="font-display">Nexa Movie Engine</text>
      <rect x="74" y="47" width="136" height="18" rx="9" fill="#09172B" stroke="#1976D2" stroke-opacity="0.75" stroke-width="1" />
      <circle cx="83" cy="56" r="2.8" fill="#38bdf8" />
      <circle cx="83" cy="56" r="2.8" fill="none" stroke="#38bdf8" stroke-width="1">
        <animate attributeName="r" values="2.8;6.8;2.8" dur="2.3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.9;0;0.9" dur="2.3s" repeatCount="indefinite" />
      </circle>
      <text x="93" y="59.5" fill="#7DD3FC" font-size="9.5" font-weight="600" letter-spacing="0.8" class="font-mono">STREAMING ENGINE</text>

      <text x="22" y="94" fill="#9FB3CC" font-size="11.5" class="font-display">Cloud media streaming web platform featuring custom HLS</text>
      <text x="22" y="112" fill="#9FB3CC" font-size="11.5" class="font-display">transmuxing, sub-second audio sync, and automated TMDB pipeline.</text>

      <g transform="translate(22, 148)">
        <rect x="0" y="0" width="60" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="30" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">Python</text>

        <rect x="68" y="0" width="84" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="110" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">Rclone VFS</text>

        <rect x="160" y="0" width="84" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="202" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">HLS Stream</text>

        <rect x="252" y="0" width="54" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="279" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">Nginx</text>
      </g>
    </g>

    <!-- ==================== CARD 3: NEXA FINANCE CORE (Bottom-Left, Cobalt Blue) ==================== -->
    <g transform="translate(18, 274)">
      <rect x="0" y="0" width="423" height="198" rx="12" fill="url(#cardSurface)" stroke="#17365C" stroke-width="1.2" />
      <rect x="1" y="0" width="421" height="2.5" rx="1.2" fill="#1976D2" fill-opacity="0.9" />
      <line x1="0" y1="1.2" x2="140" y2="1.2" stroke="url(#laserBlue)" stroke-width="2.2">
        <animate attributeName="x1" values="-140;423" dur="4.4s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0;563" dur="4.4s" repeatCount="indefinite" />
      </line>

      <g transform="translate(392, 167)" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1">
        <path d="M31,0 L0,31" /><path d="M31,10 L10,31" /><path d="M31,20 L20,31" />
        <path d="M0,31 A31,31 0 0 1 31,0" />
      </g>

      <rect x="22" y="22" width="40" height="40" rx="10" fill="url(#glowBlue)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1" />
      <g transform="translate(30, 30)" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="14" rx="2" />
        <line x1="2" y1="9" x2="22" y2="9" />
        <circle cx="6" cy="14" r="1.5" fill="#38bdf8" />
      </g>

      <text x="74" y="39" fill="#EAF2FF" font-size="16.5" font-weight="700" class="font-display">Nexa Finance Core</text>
      <rect x="74" y="47" width="128" height="18" rx="9" fill="#09172B" stroke="#1976D2" stroke-opacity="0.75" stroke-width="1" />
      <circle cx="83" cy="56" r="2.8" fill="#38bdf8" />
      <circle cx="83" cy="56" r="2.8" fill="none" stroke="#38bdf8" stroke-width="1">
        <animate attributeName="r" values="2.8;6.8;2.8" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.9;0;0.9" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="93" y="59.5" fill="#7DD3FC" font-size="9.5" font-weight="600" letter-spacing="0.8" class="font-mono">PERSONAL LEDGER</text>

      <text x="22" y="94" fill="#9FB3CC" font-size="11.5" class="font-display">Clean personal finance application with high-performance</text>
      <text x="22" y="112" fill="#9FB3CC" font-size="11.5" class="font-display">SQLite storage, transient OTP verification, and zero telemetry.</text>

      <g transform="translate(22, 148)">
        <rect x="0" y="0" width="66" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="33" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">Next.js</text>

        <rect x="74" y="0" width="84" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="116" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">SQLite WAL</text>

        <rect x="166" y="0" width="86" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="209" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">TailwindCSS</text>

        <rect x="260" y="0" width="60" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="290" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">Resend</text>
      </g>
    </g>

    <!-- ==================== CARD 4: ASTRA AUTOMATION FLEET (Bottom-Right, Crimson) ==================== -->
    <g transform="translate(459, 274)">
      <rect x="0" y="0" width="423" height="198" rx="12" fill="url(#cardSurface)" stroke="#17365C" stroke-width="1.2" />
      <rect x="1" y="0" width="421" height="2.5" rx="1.2" fill="#E62429" fill-opacity="0.85" />
      <line x1="0" y1="1.2" x2="140" y2="1.2" stroke="url(#laserRed)" stroke-width="2.2">
        <animate attributeName="x1" values="-140;423" dur="3.9s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0;563" dur="3.9s" repeatCount="indefinite" />
      </line>

      <g transform="translate(392, 167)" fill="none" stroke="#E62429" stroke-opacity="0.18" stroke-width="1">
        <path d="M31,0 L0,31" /><path d="M31,10 L10,31" /><path d="M31,20 L20,31" />
        <path d="M0,31 A31,31 0 0 1 31,0" />
      </g>

      <rect x="22" y="22" width="40" height="40" rx="10" fill="url(#glowRed)" stroke="#E62429" stroke-opacity="0.45" stroke-width="1" />
      <g transform="translate(30, 30)" stroke="#FF3340" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="9" width="18" height="11" rx="2" />
        <circle cx="8" cy="14" r="1.5" fill="#FF3340" />
        <circle cx="16" cy="14" r="1.5" fill="#FF3340" />
        <path d="M8 5a4 4 0 0 1 8 0v4H8V5z" />
      </g>

      <text x="74" y="39" fill="#EAF2FF" font-size="16.5" font-weight="700" class="font-display">Astra Automation Fleet</text>
      <rect x="74" y="47" width="142" height="18" rx="9" fill="#180B10" stroke="#E62429" stroke-opacity="0.65" stroke-width="1" />
      <circle cx="83" cy="56" r="2.8" fill="#FF3340" />
      <circle cx="83" cy="56" r="2.8" fill="none" stroke="#FF3340" stroke-width="1">
        <animate attributeName="r" values="2.8;6.8;2.8" dur="2.0s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.9;0;0.9" dur="2.0s" repeatCount="indefinite" />
      </circle>
      <text x="93" y="59.5" fill="#FF7B82" font-size="9.5" font-weight="600" letter-spacing="0.8" class="font-mono">EVENT MICROSERVICE</text>

      <text x="22" y="94" fill="#9FB3CC" font-size="11.5" class="font-display">Modular event-driven microservices orchestrating automated</text>
      <text x="22" y="112" fill="#9FB3CC" font-size="11.5" class="font-display">QRIS payment verification, Discord gateways, and health polling.</text>

      <g transform="translate(22, 148)">
        <rect x="0" y="0" width="76" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="38" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">Discord.js</text>

        <rect x="84" y="0" width="52" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="110" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">PM2</text>

        <rect x="144" y="0" width="80" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="184" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">QRIS Poller</text>

        <rect x="232" y="0" width="72" height="22" rx="6" fill="#0E1D33" stroke="#17365C" stroke-width="0.9" />
        <text x="268" y="14.5" fill="#EAF2FF" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">REST API</text>
      </g>
    </g>
